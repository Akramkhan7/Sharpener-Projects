<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }

      .shop-container {
        max-width: 850px;
        margin: 40px auto;
      }

      .shop-card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .title {
        text-align: center;
        font-weight: bold;
        margin-bottom: 30px;
        color: #198754;
      }

      .veg-item {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 15px;
      }

      .veg-info p {
        margin: 0;
        font-weight: 500;
      }

      .total-box {
        margin-top: 25px;
        text-align: right;
        font-weight: bold;
        color: #198754;
      }

      input {
        height: 45px;
      }
    </style>
  </head>

  <body>
    <div class="container shop-container">
      <div class="shop-card">
        <h2 class="title">🥦 Veg Shop</h2>

        <!-- Form -->
        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-4">
            <label class="form-label">Veg Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="Ex - Onion"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label">Price</label>
            <input
              type="number"
              class="form-control"
              placeholder="Ex - 40"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <input
              type="number"
              class="form-control"
              placeholder="Ex - 3Kg"
            />
          </div>

          <div class="col-md-2 d-grid">
            <button class="btn btn-success">
              Add Item
            </button>
          </div>
        </div>

        <!-- Item List -->
        <ul class="list-unstyled">
         
        </ul>

        <!-- Total -->
        <div class="total-box">
          <h4>Total Items : 1</h4>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
